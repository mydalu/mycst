        // 获取域名对应的文字（支持带www的域名）

            var domain = window.location.hostname.toUpperCase();

            if (domain.includes('NWIDT.COM')) return '时光访谈录';
            if (domain.includes('XZ114.COM')) return '村志村史馆';
            
            return '新境传播';
        }
        // 一次性设置所有位置
        var text = getSiteText();
        document.getElementById('sitename').textContent = text;
