    <!-- 媒体内容区域 -->
    <div style="background:#fff; padding:10px;">
                    <!-- 播放器 -->
            <div class="player">
                <div class="cover">
                    <svg viewBox="0 0 24 24">
                        <rect x="4" y="4" width="16" height="16" fill="none" stroke="#8a7a63" stroke-width="1"/>
                        <path d="M10 8v8l6-4z" fill="#8a7a63" opacity=".4"/>
                    </svg>
                    <div class="cover-text">点击下方标题播放</div>
                </div>
                <video id="mainVideo" controls></video>
            </div>
            
            <div id="playlist" class="playlist"></div>
            
            <div class="player-controls">
                <div class="toggle-control" id="autoToggle">
                    <span>自动下一集</span>
                    <div class="toggle-switch active" id="toggleBtn"></div>
                </div>
                <div id="currentVideo">当前未选择</div>
            </div>
            
            <div id="video-data" data-items='[
			{"id":"v1","t":"2006游武侯祠-自拍-同事小聚","s":"http://file.e651.com/3/1005/v/v-2006.webm","d":"02:17"},
			{"id":"v2","t":"游武侯祠2","s":"http://file.e651.com/3/1005/v/200609wuhouci.mp4","d":"222"},
			{"id":"v3","t":"游武侯祠3","s":"http://file.e651.com/3/1005/v/200609wuhouci.mp4","d":"222"}
			]'></div>
            
            <script>
            (function() {
                const videoData = JSON.parse(document.getElementById('video-data').dataset.items || '[]');
                let currentIdx = 0;
                let autoPlay = true;
                
                // 初始化播放列表
                videoData.forEach((video, idx) => {
                    const item = document.createElement('div');
                    item.className = 'playlist-item';
                    item.innerHTML = `<span>${video.id}.${video.t}</span><span>${video.d}</span>`;
                    item.onclick = () => playVideo(idx);
                    document.getElementById('playlist').appendChild(item);
                });
                
                // 检查URL锚点
                const hash = location.hash.substring(1);
                const hashIdx = videoData.findIndex(v => v.id === hash);
                if (hashIdx !== -1) playVideo(hashIdx);
                
                // 视频结束自动播放下一集
                document.getElementById('mainVideo').onended = () => {
                    if (autoPlay) playVideo((currentIdx + 1) % videoData.length);
                };
                
                // 自动播放切换
                document.getElementById('autoToggle').onclick = () => {
                    autoPlay = !autoPlay;
                    document.getElementById('toggleBtn').classList.toggle('active', autoPlay);
                };
                
                // 播放视频
                function playVideo(idx) {
                    if (idx < 0 || idx >= videoData.length) return;
                    
                    const video = videoData[idx];
                    const videoEl = document.getElementById('mainVideo');
                    
                    videoEl.src = video.s;
                    videoEl.style.display = 'block';
                    document.querySelector('.cover').style.display = 'none';
                    
                    currentIdx = idx;
                    document.getElementById('currentVideo').textContent = video.t;
                    
                    // 更新播放列表高亮
                    document.querySelectorAll('.playlist-item').forEach((item, i) => {
                        item.classList.toggle('active', i === idx);
                    });
                    
                    location.hash = video.id;
                    videoEl.play().catch(e => console.log('需要用户交互'));
                }
                
                window.playVideo = playVideo; // 暴露给全局，方便调试
            })();
            </script>

    <script>
    // 懒加载
    document.addEventListener('DOMContentLoaded', () => {
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    const img = entry.target;
                    img.src = img.dataset.src;
                    observer.unobserve(img);
                }
            });
        });
        
        document.querySelectorAll('img.lazy').forEach(img => observer.observe(img));
    });
    
    // 目录生成
    const toc = document.getElementById('toc');
    if (toc) {
        const h3s = document.querySelectorAll('h3');
        if (h3s.length) {
            const ol = document.createElement('ol');
            h3s.forEach((h3, i) => {
                h3.id = `section-${i+1}`;
                const li = document.createElement('li');
                li.innerHTML = `<a href="#${h3.id}">${h3.textContent}</a>`;
                ol.appendChild(li);
            });
            toc.appendChild(ol);
        }
    }
    
    // 返回顶部
    const backTop = document.getElementById('backTop');
    window.addEventListener('scroll', () => {
        backTop.style.display = window.scrollY > 200 ? 'block' : 'none';
    });
    backTop.addEventListener('click', () => window.scrollTo({ top:0, behavior:'smooth' }));
    
    // 页内搜索
    function performSearch() {
        const text = document.getElementById('searchInput').value.trim();
        if (!text) return;
        
        // 清除之前的高亮
        document.querySelectorAll('.highlight').forEach(el => {
            el.replaceWith(...el.childNodes);
        });
        
        // 搜索并高亮
        const walker = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT);
        const regex = new RegExp(`(${text})`, 'gi');
        const ranges = [];
        let node;
        
        while (node = walker.nextNode()) {
            const matches = node.textContent.match(regex);
            if (matches) {
                let offset = 0;
                matches.forEach(match => {
                    const idx = node.textContent.indexOf(match, offset);
                    const range = document.createRange();
                    range.setStart(node, idx);
                    range.setEnd(node, idx + match.length);
                    ranges.push(range);
                    offset = idx + match.length;
                });
            }
        }
        
        ranges.forEach(range => {
            const span = document.createElement('span');
            span.className = 'highlight';
            span.textContent = range.toString();
            range.deleteContents();
            range.insertNode(span);
        });
    }
    </script>
