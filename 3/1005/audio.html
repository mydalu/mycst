    <!-- 播放器容器 - 使用唯一ID避免冲突 -->

        <div class="player-controls">
            <!-- 拆分播放模式为独立按钮 -->

            <button class="control-btn" id="mode-list">列表循环</button>
            <!--<button class="control-btn" id="mode-none">顺序播放</button>
             缩小的上一曲/下一曲按钮
            <button class="control-btn prev-next-btn" id="prev-btn">上一曲</button>
            <button class="control-btn prev-next-btn" id="next-btn">下一曲</button> -->

        <ul class="audio-list" id="audio-list-container"></ul>
    </div>

    <script>
        // 命名空间隔离 - 避免变量/函数冲突
        const CustomAudioPlayer = (function() {
            // 音频数据 - 按你的格式定义
            const audioDataStr = `
                210409我这样做直播@http://file.e651.com/3/1005/v/210409.mp3|||
231018我少年时的无知@http://file.e651.com/3/1005/v/231018.mp3|||
231121对自己的提醒@http://file.e651.com/3/1005/v/231121.mp3|||
231129不能等待的感谢@http://file.e651.com/3/1005/v/231129.mp3|||
231205给孩子的信@http://file.e651.com/3/1005/v/231205.mp3|||
231206我的忍耐与等候@http://file.e651.com/3/1005/v/231206.mp3|||
231207怜悯我的孩子@http://file.e651.com/3/1005/v/231207.mp3|||
231208我是个无情的丈夫@http://file.e651.com/3/1005/v/231208.mp3|||
231212劣根性的美意@http://file.e651.com/3/1005/v/231212.mp3|||
231221认知即命运@http://file.e651.com/3/1005/v/231221.mp3|||
231231追求的统一@http://file.e651.com/3/1005/v/231231.mp3|||
240101苏醒的状态@http://file.e651.com/3/1005/v/240101.mp3|||
                260204音频留档供未来训练@http://file.e651.com/3/1005/v/260204-ai.mp3|||
            `;

            // 解析音频数据
            const parseAudioData = (str) => {
                return str.trim()
                    .split('|||')
                    .filter(item => item.trim())
                    .map((item, index) => {
                        const [title, url] = item.split('@');
                        return {
                            id: `audio-${index + 1}`,
                            title: title.trim(),
                            url: url.trim()
                        };
                    });
            };

            // 播放器状态
            const state = {
                audioList: [],
                currentIndex: 0,
                playMode: 'single', // single:单曲循环, list:列表循环, none:顺序播放(播放完停止)
                audioElement: null,
                listContainer: null,
                modeButtons: {
                    single: null,
                    list: null,
                    none: null
                }
            };

            // 初始化函数
            const init = () => {
                // 解析音频数据
                state.audioList = parseAudioData(audioDataStr);
                
                // 获取DOM元素
                state.audioElement = document.getElementById('main-audio');
                state.listContainer = document.getElementById('audio-list-container');
                
                // 获取播放模式按钮
                state.modeButtons.single = document.getElementById('mode-single');
                state.modeButtons.list = document.getElementById('mode-list');
                state.modeButtons.none = document.getElementById('mode-none');
                
                // 检查URL锚点
                checkHash();
                
                // 渲染音频列表
                renderAudioList();
                
                // 绑定事件
                bindEvents();
                
                // 初始化播放
                playAudio(state.currentIndex);
            };

            // 检查URL锚点并定位音频
            const checkHash = () => {
                const hash = window.location.hash.slice(1);
                if (hash) {
                    const targetIndex = state.audioList.findIndex(item => item.id === hash);
                    if (targetIndex !== -1) {
                        state.currentIndex = targetIndex;
                    }
                }
            };

            // 渲染音频列表
            const renderAudioList = () => {
                state.listContainer.innerHTML = '';
                state.audioList.forEach((item, index) => {
                    const li = document.createElement('li');
                    li.className = `audio-item ${index === state.currentIndex ? 'active' : ''}`;
                    li.dataset.index = index;
                    li.id = item.id; // 设置锚点ID
                    li.innerHTML = `
                        <span>${index + 1}. ${item.title}</span>
                    `;
                    state.listContainer.appendChild(li);
                });
            };

            // 播放指定索引的音频
            const playAudio = (index) => {
                if (index < 0 || index >= state.audioList.length) return;
                
                // 更新当前索引
                state.currentIndex = index;
                const currentAudio = state.audioList[index];
                
                // 更新音频源
                state.audioElement.src = currentAudio.url;
                state.audioElement.play().catch(err => console.log('播放失败:', err));
                
                // 更新URL锚点
                window.location.hash = currentAudio.id;
                
                // 更新列表选中状态
                document.querySelectorAll('.audio-item').forEach((item, i) => {
                    item.classList.toggle('active', i === index);
                });
            };

            // 设置播放模式
            const setPlayMode = (mode) => {
                state.playMode = mode;
                
                // 移除所有模式按钮的高亮
                Object.values(state.modeButtons).forEach(btn => {
                    btn.classList.remove('mode-active');
                });
                
                // 高亮当前模式按钮
                state.modeButtons[mode].classList.add('mode-active');
            };

            // 上一曲
            const playPrev = () => {
                let newIndex = state.currentIndex - 1;
                if (newIndex < 0) {
                    newIndex = state.playMode === 'list' ? state.audioList.length - 1 : 0;
                }
                playAudio(newIndex);
            };

            // 下一曲
            const playNext = () => {
                let newIndex = state.currentIndex + 1;
                if (newIndex >= state.audioList.length) {
                    newIndex = state.playMode === 'list' ? 0 : state.audioList.length - 1;
                }
                playAudio(newIndex);
            };

            // 绑定事件
            const bindEvents = () => {
                // 音频播放结束事件
                state.audioElement.addEventListener('ended', () => {
                    switch (state.playMode) {
                        case 'single':
                            state.audioElement.play(); // 单曲循环
                            break;
                        case 'list':
                            playNext(); // 列表循环
                            break;
                        case 'none':
                            // 顺序播放 - 播放完停止
                            break;
                    }
                });

                // 音频列表点击事件
                state.listContainer.addEventListener('click', (e) => {
                    const li = e.target.closest('.audio-item');
                    if (li) {
                        const index = parseInt(li.dataset.index);
                        playAudio(index);
                    }
                });

                // 播放模式按钮事件
                state.modeButtons.single.addEventListener('click', () => setPlayMode('single'));
                state.modeButtons.list.addEventListener('click', () => setPlayMode('list'));
                state.modeButtons.none.addEventListener('click', () => setPlayMode('none'));

                // 上一曲/下一曲按钮事件
                document.getElementById('prev-btn').addEventListener('click', playPrev);
                document.getElementById('next-btn').addEventListener('click', playNext);

                // 监听锚点变化
                window.addEventListener('hashchange', checkHash);
            };

            // 暴露初始化方法
            return { init };
        })();

        // 页面加载完成后初始化
        document.addEventListener('DOMContentLoaded', () => {
            CustomAudioPlayer.init();
        });
    </script>

    // 页内搜索
    function performSearch() {
        const text = document.getElementById('searchInput').value.trim();
        if (!text) return;
        
        // 清除之前的高亮
        document.querySelectorAll('.highlight').forEach(el => {
            el.replaceWith(...el.childNodes);
        });
        
        // 搜索并高亮
        const walker = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT);
        const regex = new RegExp(`(${text})`, 'gi');
        const ranges = [];
        let node;
        
        while (node = walker.nextNode()) {
            const matches = node.textContent.match(regex);
            if (matches) {
                let offset = 0;
                matches.forEach(match => {
                    const idx = node.textContent.indexOf(match, offset);
                    const range = document.createRange();
                    range.setStart(node, idx);
                    range.setEnd(node, idx + match.length);
                    ranges.push(range);
                    offset = idx + match.length;
                });
            }
        }
        
        ranges.forEach(range => {
            const span = document.createElement('span');
            span.className = 'highlight';
            span.textContent = range.toString();
            range.deleteContents();
            range.insertNode(span);
        });
    }
    </script>
