        `;

        // 解析数据源（去除空白、分割行、过滤空行）
        const dataList = dataStr
            .trim() // 去掉首尾空白
            .split('\n') // 按换行分割每行
            .map(line => line.trim()) // 去掉每行的首尾空格
            .filter(line => line); // 过滤空行

        // 2. 解析数据并存储
        const parsedData = dataList.map(item => {
            const [content] = item.split('|||'); // 分割每行结尾的标识
            const [title, imgUrl] = content.split('@'); // 分割标题和图片URL
            return { 
                title: title || '无标题', 
                imgUrl: imgUrl || '',
                anchor: `img-${Date.now()}-${Math.floor(Math.random() * 1000)}` // 生成唯一锚点标识
            };
        }).filter(item => item.imgUrl); // 过滤掉无效的图片URL

        // 3. DOM元素获取
        const imageGrid = document.getElementById('imageGrid');
        const previewModal = document.getElementById('previewModal');
        const previewImg = document.getElementById('previewImg');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        
        let currentIndex = 0; // 当前预览图片索引
        let scale = 1; // 图片缩放比例
        let startX = 0; // 触摸起始X坐标
        let startY = 0; // 触摸起始Y坐标
        let isDragging = false; // 是否正在拖拽

        // 4. 渲染图片列表（增加懒加载+锚点）
        function renderImageList() {
            // 使用文档片段减少DOM重绘，提升效率
            const fragment = document.createDocumentFragment();
            
            parsedData.forEach((item, index) => {
                const card = document.createElement('div');
                card.className = 'image-card';
                card.dataset.index = index; // 存储图片索引
                card.id = item.anchor; // 给卡片添加锚点ID
                
                const img = document.createElement('img');
                img.className = 'card-img';
                // 懒加载核心：设置data-src存储真实URL，src用占位图（也可留空）
                img.dataset.src = item.imgUrl; 
                img.alt = item.title;
                img.loading = 'lazy'; // 启用原生懒加载
                
                const title = document.createElement('div');
                title.className = 'card-title';
                title.textContent = item.title;
                
                card.appendChild(img);
                card.appendChild(title);
                fragment.appendChild(card);
                
                // 绑定点击事件
                card.addEventListener('click', () => openPreview(index));
            });
            
            imageGrid.appendChild(fragment);

            // 初始化懒加载（兼容不支持原生loading="lazy"的浏览器）
            initLazyLoad();
            
            // 解析URL锚点并打开对应图片
            parseUrlAnchor();
        }

        // 5. 懒加载实现（增强版，兼容所有现代浏览器）
        function initLazyLoad() {
            const lazyImages = document.querySelectorAll('.card-img[data-src]');
            
            // 观察器配置
            const observerOptions = {
                root: null, // 视口作为根
                rootMargin: '200px 0px', // 提前200px加载
                threshold: 0.1
            };

            const imageObserver = new IntersectionObserver((entries, observer) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        const img = entry.target;
                        img.src = img.dataset.src; // 加载真实图片
                        img.removeAttribute('data-src'); // 移除临时属性
                        observer.unobserve(img); // 停止观察已加载的图片
                    }
                });
            }, observerOptions);

            // 为所有懒加载图片添加观察
            lazyImages.forEach(img => {
                imageObserver.observe(img);
            });
        }

        // 6. 解析URL锚点并打开对应图片
        function parseUrlAnchor() {
            // 获取URL中的锚点（#后面的内容）
            const hash = window.location.hash.slice(1);
            if (!hash) return;
            
            // 根据锚点查找对应的图片索引
            const targetIndex = parsedData.findIndex(item => item.anchor === hash);
            if (targetIndex !== -1) {
                // 页面加载完成后打开对应图片预览
                setTimeout(() => {
                    openPreview(targetIndex);
                    // 滚动到对应图片位置（可选）
                    document.getElementById(hash)?.scrollIntoView({
                        behavior: 'smooth',
                        block: 'center'
                    });
                }, 100);
            }
        }

        // 7. 打开预览浮层（更新URL锚点）
        function openPreview(index) {
            currentIndex = index;
            scale = 1; // 重置缩放比例
            previewImg.src = parsedData[index].imgUrl;
            previewImg.alt = parsedData[index].title;
            previewImg.style.transform = `scale(${scale})`;
            previewModal.style.display = 'flex';
            
            // 更新URL锚点，不刷新页面
            const anchor = parsedData[index].anchor;
            window.history.replaceState({}, '', `#${anchor}`);
        }

        // 8. 关闭预览浮层（清空锚点）
        function closePreview() {
            previewModal.style.display = 'none';
            // 清空URL锚点
            window.history.replaceState({}, '', window.location.pathname);
        }

        // 9. 切换图片（同步更新锚点）
        function switchImage(direction) {
            currentIndex += direction;
            // 循环切换
            if (currentIndex < 0) currentIndex = parsedData.length - 1;
            if (currentIndex >= parsedData.length) currentIndex = 0;
            
            scale = 1; // 切换时重置缩放
            previewImg.src = parsedData[currentIndex].imgUrl;
            previewImg.alt = parsedData[currentIndex].title;
            previewImg.style.transform = `scale(${scale})`;
            
            // 更新URL锚点
            const anchor = parsedData[currentIndex].anchor;
            window.history.replaceState({}, '', `#${anchor}`);
        }

        // 10. 图片缩放功能
        function handleScale(e) {
            // 鼠标滚轮缩放
            if (e.type === 'wheel') {
                e.preventDefault();
                const delta = e.deltaY > 0 ? -0.1 : 0.1;
                scale = Math.max(0.5, Math.min(scale + delta, 3)); // 限制缩放范围0.5-3倍
                previewImg.style.transform = `scale(${scale})`;
            }
            
            // 触摸缩放（简单实现单指缩放，如需双指缩放可扩展）
            if (e.type === 'touchstart') {
                startX = e.touches[0].clientX;
                startY = e.touches[0].clientY;
                isDragging = true;
            }
            
            if (e.type === 'touchmove' && isDragging) {
                e.preventDefault();
                const moveX = e.touches[0].clientX - startX;
                const moveY = e.touches[0].clientY - startY;
                
                // 简单的滑动缩放逻辑（也可改为拖拽平移）
                if (Math.abs(moveY) > 10) {
                    scale = Math.max(0.5, Math.min(scale + (moveY > 0 ? -0.01 : 0.01), 3));
                    previewImg.style.transform = `scale(${scale})`;
                    startY = e.touches[0].clientY;
                }
                
                // 左右滑动切换图片
                if (Math.abs(moveX) > 50 && Math.abs(moveY) < 50) {
                    switchImage(moveX > 0 ? -1 : 1);
                    isDragging = false;
                }
            }
            
            if (e.type === 'touchend') {
                isDragging = false;
            }
        }

        // 11. 监听锚点变化（手动修改URL时触发）
        window.addEventListener('hashchange', parseUrlAnchor);

        // 12. 绑定事件
        function bindEvents() {
            // 关闭浮层（点击浮层背景或图片）
            previewModal.addEventListener('click', (e) => {
                if (e.target === previewModal || e.target === previewImg) {
                    closePreview();
                }
            });
            
            // 切换按钮事件
            prevBtn.addEventListener('click', () => switchImage(-1));
            nextBtn.addEventListener('click', () => switchImage(1));
            
            // 键盘控制
            document.addEventListener('keydown', (e) => {
                if (previewModal.style.display === 'flex') {
                    if (e.key === 'Escape') closePreview();
                    if (e.key === 'ArrowLeft') switchImage(-1);
                    if (e.key === 'ArrowRight') switchImage(1);
                }
            });
            
            // 缩放事件
            previewImg.addEventListener('wheel', handleScale);
            previewImg.addEventListener('touchstart', handleScale);
            previewImg.addEventListener('touchmove', handleScale);
            previewImg.addEventListener('touchend', handleScale);
        }

        // 初始化
        function init() {
            renderImageList();
            bindEvents();
        }

        // 执行初始化
        init();
    </script>

    <script src="//cp.eecms.com/skin/dalu/js/tw2cn.js"></script>
    <script>
    // 懒加载
    document.addEventListener('DOMContentLoaded', () => {
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    const img = entry.target;
                    img.src = img.dataset.src;
                    observer.unobserve(img);
                }
            });
        });
        
        document.querySelectorAll('img.lazy').forEach(img => observer.observe(img));
    });
    
    // 目录生成
    const toc = document.getElementById('toc');
    if (toc) {
        const h3s = document.querySelectorAll('h3');
        if (h3s.length) {
            const ol = document.createElement('ol');
            h3s.forEach((h3, i) => {
                h3.id = `section-${i+1}`;
                const li = document.createElement('li');
                li.innerHTML = `<a href="#${h3.id}">${h3.textContent}</a>`;
                ol.appendChild(li);
            });
            toc.appendChild(ol);
        }
    }
    
    // 返回顶部
    const backTop = document.getElementById('backTop');
    window.addEventListener('scroll', () => {
        backTop.style.display = window.scrollY > 200 ? 'block' : 'none';
    });
    backTop.addEventListener('click', () => window.scrollTo({ top:0, behavior:'smooth' }));
    
    // 页内搜索
    function performSearch() {
        const text = document.getElementById('searchInput').value.trim();
        if (!text) return;
        
        // 清除之前的高亮
        document.querySelectorAll('.highlight').forEach(el => {
            el.replaceWith(...el.childNodes);
        });
        
        // 搜索并高亮
        const walker = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT);
        const regex = new RegExp(`(${text})`, 'gi');
        const ranges = [];
        let node;
        
        while (node = walker.nextNode()) {
            const matches = node.textContent.match(regex);
            if (matches) {
                let offset = 0;
                matches.forEach(match => {
                    const idx = node.textContent.indexOf(match, offset);
                    const range = document.createRange();
                    range.setStart(node, idx);
                    range.setEnd(node, idx + match.length);
                    ranges.push(range);
                    offset = idx + match.length;
                });
            }
        }
        
        ranges.forEach(range => {
            const span = document.createElement('span');
            span.className = 'highlight';
            span.textContent = range.toString();
            range.deleteContents();
            range.insertNode(span);
        });
    }
    </script>
</body>
</html>
