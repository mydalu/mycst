<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>Word to HTML Converter</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
    <style>
        #htmlOutput {
            border: 1px solid #ccc;
            padding: 10px;
            margin-top: 10px;
            font-family: sans-serif;
        }
        img {
            max-width: 600px; /* 限制图片最大宽度 */
            height: auto;
        }
    </style>
</head>
<body>
    <h1>Word to HTML Converter</h1>
    <input type="file" id="fileInput" accept=".docx" />
    <div id="htmlOutput"></div>

    <script>
        document.getElementById('fileInput').addEventListener('change', function(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();

                reader.onload = function(e) {
                    const arrayBuffer = e.target.result;

                    mammoth.convertToHtml({arrayBuffer: arrayBuffer})
                        .then(function(result){
                            let html = result.value;

                            // 创建一个临时的DOM元素来处理HTML
                            const tempDiv = document.createElement('div');
                            tempDiv.innerHTML = html;

                            // 获取所有图片元素
                            const images = tempDiv.querySelectorAll('img');

                            // 循环处理每个图片
                            const promises = Array.from(images).map(img => {
                                return new Promise((resolve, reject) => {
                                    const imageUrl = img.src;

                                    // 创建一个新的Image对象来加载图片
                                    const image = new Image();
                                    image.src = imageUrl;

                                    image.onload = function() {
                                        // 创建Canvas来调整图片大小并转换为Base64
                                        const canvas = document.createElement('canvas');
                                        const maxWidth = 600;
                                        let width = image.width;
                                        let height = image.height;

                                        if (width > maxWidth) {
                                            height *= maxWidth / width;
                                            width = maxWidth;
                                        }

                                        canvas.width = width;
                                        canvas.height = height;
                                        const ctx = canvas.getContext('2d');
                                        ctx.drawImage(image, 0, 0, width, height);

                                        const base64Image = canvas.toDataURL('image/jpeg', 0.8); // 转换为Base64，可以调整图片格式和质量
                                        img.src = base64Image; // 替换img标签的src属性
                                        resolve();
                                    };

                                    image.onerror = function() {
                                        console.error('Error loading image:', imageUrl);
                                        reject();
                                    };
                                });
                            });

                            // 等待所有图片处理完成
                            Promise.all(promises).then(() => {
                                // 将处理后的HTML显示在页面上
                                document.getElementById('htmlOutput').innerHTML = tempDiv.innerHTML;
                            }).catch(error => {
                                console.error('Error processing images:', error);
                                document.getElementById('htmlOutput').innerText = 'Error processing images.';
                            });

                        })
                        .done();
                };

                reader.readAsArrayBuffer(file);
            }
        });
    </script>

</div>
</body>
</html>
