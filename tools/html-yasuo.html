<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML压缩工具</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }
        
        body {
            padding: 15px;
            max-width: 1200px;
            margin: 0 auto;
        }
        
        h1 {
            text-align: center;
            margin-bottom: 20px;
            color: #333;
        }
        
        .stats {
            display: flex;
            gap: 20px;
            margin: 15px 0;
            padding: 10px;
            background: #f0f0f0;
            border-radius: 4px;
        }
        
        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin: 15px 0;
        }
        
        button {
            padding: 8px 16px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        
        button:hover {
            background: #0056b3;
        }
        
        .options {
            margin: 15px 0;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 8px;
        }
        
        .editor-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin: 20px 0;
        }
        
        @media (max-width: 768px) {
            .editor-container {
                grid-template-columns: 1fr;
            }
        }
        
        textarea {
            width: 100%;
            height: 300px;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-family: monospace;
            resize: vertical;
        }
        
        .preview {
            margin-top: 20px;
            padding: 15px;
            border: 1px solid #ddd;
            min-height: 100px;
        }
    </style>
</head>
<body>
    <h1>HTML压缩工具</h1>
    
    <div class="stats">
        <div>原始大小: <span id="originalSize">0 KB</span></div>
        <div>压缩后大小: <span id="compressedSize">0 KB</span></div>
        <div>压缩率: <span id="compressionRatio">0%</span></div>
    </div>
    
    <div class="controls">
        <button id="compressBtn">压缩HTML</button>
        <button id="formatBtn">格式化HTML</button>
        <button id="clearBtn">清空</button>
        <button id="copyBtn">复制结果</button>
    </div>
    
    <div class="options">
        <label><input type="checkbox" id="removeComments" checked> 移除注释</label>
        <label><input type="checkbox" id="removeWhitespace" checked> 移除空格</label>
        <label><input type="checkbox" id="minifyCss" checked> 压缩CSS</label>
        <label><input type="checkbox" id="minifyJs" checked> 压缩JS</label>
    </div>
    
    <div class="editor-container">
        <div>
            <h3>原始HTML</h3>
            <textarea id="originalHtml" placeholder="粘贴HTML代码..."></textarea>
        </div>
        <div>
            <h3>压缩后HTML</h3>
            <textarea id="compressedHtml" readonly placeholder="压缩结果将显示在这里..."></textarea>
        </div>
    </div>
    
    <h3>预览效果</h3>
    <div class="preview" id="preview"></div>

    <script>
        // 获取DOM元素
        const originalHtml = document.getElementById('originalHtml');
        const compressedHtml = document.getElementById('compressedHtml');
        const preview = document.getElementById('preview');
        const compressBtn = document.getElementById('compressBtn');
        const formatBtn = document.getElementById('formatBtn');
        const clearBtn = document.getElementById('clearBtn');
        const copyBtn = document.getElementById('copyBtn');
        const originalSize = document.getElementById('originalSize');
        const compressedSize = document.getElementById('compressedSize');
        const compressionRatio = document.getElementById('compressionRatio');
        
        // 初始化示例代码
        window.addEventListener('load', () => {
            if (!originalHtml.value) {
                originalHtml.value = `<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>示例页面</title>
    <style>
        body { font-family: Arial; margin: 20px; }
    </style>
</head>
<body>
    <h1>Hello World!</h1>
    <p>这是示例内容</p>
</body>
</html>`;
                updateStats();
            }
        });
        
        // 更新统计信息
        function updateStats() {
            const originalBytes = new Blob([originalHtml.value]).size;
            const compressedBytes = compressedHtml.value ? new Blob([compressedHtml.value]).size : 0;
            
            originalSize.textContent = (originalBytes / 1024).toFixed(2) + ' KB';
            compressedSize.textContent = (compressedBytes / 1024).toFixed(2) + ' KB';
            
            if (originalBytes > 0 && compressedBytes > 0) {
                const ratio = ((1 - compressedBytes / originalBytes) * 100).toFixed(2);
                compressionRatio.textContent = ratio + '%';
            } else {
                compressionRatio.textContent = '0%';
            }
        }
        
        // HTML压缩核心函数
        function compressHtml(html) {
            // 移除注释
            if (document.getElementById('removeComments').checked) {
                html = html.replace(/<!--[\s\S]*?-->/g, '');
            }
            
            // 压缩CSS
            if (document.getElementById('minifyCss').checked) {
                html = html.replace(/<style[^>]*>[\s\S]*?<\/style>/gi, (match) => {
                    return match.replace(/\/\*[\s\S]*?\*\//g, '')
                                .replace(/\s+/g, ' ')
                                .replace(/{\s+/g, '{')
                                .replace(/\s+}/g, '}')
                                .replace(/:\s+/g, ':')
                                .replace(/,\s+/g, ',');
                });
            }
            
            // 压缩JS
            if (document.getElementById('minifyJs').checked) {
                html = html.replace(/<script[^>]*>[\s\S]*?<\/script>/gi, (match) => {
                    return match.replace(/\/\/.*$/gm, '')
                                .replace(/\/\*[\s\S]*?\*\//g, '')
                                .replace(/\s+/g, ' ')
                                .replace(/{\s+/g, '{')
                                .replace(/\s+}/g, '}')
                                .replace(/:\s+/g, ':')
                                .replace(/,\s+/g, ',');
                });
            }
            
            // 移除空格和换行
            if (document.getElementById('removeWhitespace').checked) {
                html = html.replace(/\s+/g, ' ');
                html = html.replace(/>\s+</g, '><');
                html = html.replace(/[\r\n]/g, '');
            }
            
            return html.trim();
        }
        
        // 格式化HTML
        function formatHtml(html) {
            let formatted = '';
            let indentLevel = 0;
            let inTag = false;
            
            for (let i = 0; i < html.length; i++) {
                const char = html[i];
                
                if (char === '<') {
                    inTag = true;
                    if (html[i+1] === '/') indentLevel--;
                    formatted += '\n' + '  '.repeat(indentLevel) + char;
                    if (html[i+1] !== '/' && html[i+1] !== '!' && html.substr(i, 2) !== '</') indentLevel++;
                } else if (char === '>') {
                    inTag = false;
                    formatted += char;
                } else {
                    if (!inTag && char === ' ') continue;
                    formatted += char;
                }
            }
            
            return formatted.trim();
        }
        
        // 事件监听
        compressBtn.addEventListener('click', () => {
            if (!originalHtml.value.trim()) return;
            
            try {
                const result = compressHtml(originalHtml.value);
                compressedHtml.value = result;
                preview.innerHTML = result;
                updateStats();
            } catch (e) {
                alert('压缩失败: ' + e.message);
            }
        });
        
        formatBtn.addEventListener('click', () => {
            if (!originalHtml.value.trim()) return;
            originalHtml.value = formatHtml(originalHtml.value);
        });
        
        clearBtn.addEventListener('click', () => {
            originalHtml.value = '';
            compressedHtml.value = '';
            preview.innerHTML = '';
            updateStats();
        });
        
        copyBtn.addEventListener('click', async () => {
            if (!compressedHtml.value.trim()) return;
            
            try {
                await navigator.clipboard.writeText(compressedHtml.value);
                alert('已复制到剪贴板！');
            } catch (e) {
                compressedHtml.select();
                document.execCommand('copy');
                alert('已复制到剪贴板！');
            }
        });
        
        originalHtml.addEventListener('input', updateStats);
    </script>
	<div align="center"><br />
<a href="/tools/" style="font-size:12px;color:#999999;text-decoration: none;">返回工具列表</a>	<span style="font-size:12px;color:#999999;">联系站长 E651@msn.com</span>
</div>
</body>
</html>
