<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>在线批量ZIP压缩工具</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: #333;
        }
        
        .container {
            background-color: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 800px;
            padding: 30px;
        }
        
        header {
            text-align: center;
            margin-bottom: 30px;
        }
        
        h1 {
            color: #2575fc;
            margin-bottom: 10px;
            font-weight: 600;
        }
        
        .description {
            color: #666;
            line-height: 1.5;
            margin-bottom: 10px;
        }
        
        .features {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 20px;
            justify-content: center;
        }
        
        .feature-tag {
            background-color: #eef5ff;
            color: #2575fc;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 500;
        }
        
        .upload-area {
            border: 2px dashed #2575fc;
            border-radius: 10px;
            padding: 40px 20px;
            text-align: center;
            margin-bottom: 25px;
            background-color: #f8fbff;
            transition: all 0.3s;
            cursor: pointer;
        }
        
        .upload-area:hover {
            background-color: #eef5ff;
        }
        
        .upload-area.dragover {
            background-color: #e1eeff;
            border-color: #1a68e8;
        }
        
        .upload-icon {
            font-size: 48px;
            color: #2575fc;
            margin-bottom: 15px;
        }
        
        .upload-text {
            margin-bottom: 15px;
            color: #555;
        }
        
        .browse-btn {
            background-color: #2575fc;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: 500;
            transition: background-color 0.3s;
        }
        
        .browse-btn:hover {
            background-color: #1a68e8;
        }
        
        .options {
            display: flex;
            gap: 20px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }
        
        .option-group {
            flex: 1;
            min-width: 200px;
        }
        
        .option-label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: #444;
        }
        
        select, input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 16px;
        }
        
        .file-list {
            margin-bottom: 25px;
            max-height: 300px;
            overflow-y: auto;
            border: 1px solid #eee;
            border-radius: 8px;
            padding: 10px;
        }
        
        .file-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            border-bottom: 1px solid #f0f0f0;
        }
        
        .file-item:last-child {
            border-bottom: none;
        }
        
        .file-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .file-icon {
            color: #2575fc;
        }
        
        .file-name {
            font-weight: 500;
        }
        
        .file-size {
            color: #777;
            font-size: 0.9rem;
        }
        
        .delete-btn {
            background: none;
            border: none;
            color: #e74c3c;
            cursor: pointer;
            font-size: 1.2rem;
            padding: 5px;
        }
        
        .actions {
            display: flex;
            gap: 15px;
            margin-bottom: 25px;
        }
        
        .action-btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .compress-btn {
            background-color: #2575fc;
            color: white;
        }
        
        .compress-btn:hover {
            background-color: #1a68e8;
            transform: translateY(-2px);
        }
        
        .clear-btn {
            background-color: #e74c3c;
            color: white;
        }
        
        .clear-btn:hover {
            background-color: #c0392b;
            transform: translateY(-2px);
        }
        
        .results {
            background-color: #f8fbff;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
            display: none;
        }
        
        .results h3 {
            margin-bottom: 15px;
            color: #2575fc;
        }
        
        .result-item {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #eef5ff;
        }
        
        .download-area {
            text-align: center;
            padding: 20px;
            background-color: #eef5ff;
            border-radius: 10px;
            display: none;
        }
        
        .download-btn {
            background-color: #2ecc71;
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 5px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        
        .download-btn:hover {
            background-color: #27ae60;
        }
        
        .footer {
            text-align: center;
            margin-top: 20px;
            color: #777;
            font-size: 0.9rem;
        }
        
        @media (max-width: 600px) {
            .options {
                flex-direction: column;
            }
            
            .actions {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>在线批量ZIP压缩工具</h1>
            <p class="description">一款方便快捷的文件压缩解决方案，支持用户同时选择多个文件进行压缩，并生成一个ZIP文件。</p>
            <div class="features">
                <span class="feature-tag">批量文件选择</span>
                <span class="feature-tag">多平台支持</span>
                <span class="feature-tag">自定义压缩级别</span>
                <span class="feature-tag">文件删除功能</span>
                <span class="feature-tag">压缩结果反馈</span>
                <span class="feature-tag">ZIP文件下载</span>
                <span class="feature-tag">全程本地处理</span>
            </div>
        </header>
        
        <div class="upload-area" id="uploadArea">
            <div class="upload-icon">📁</div>
            <p class="upload-text">拖放文件到此处，或点击下方按钮选择文件</p>
            <button class="browse-btn" id="browseBtn">选择文件</button>
            <input type="file" id="fileInput" multiple style="display: none;">
        </div>
        
        <div class="options">
            <div class="option-group">
                <label class="option-label" for="compressionLevel">压缩级别</label>
                <select id="compressionLevel">
                    <option value="0">0 - 不压缩</option>
                    <option value="1">1 - 快速压缩</option>
                    <option value="3" selected>3 - 标准压缩</option>
                    <option value="6">6 - 较好压缩</option>
                    <option value="9">9 - 最佳压缩</option>
                </select>
            </div>
            
            <div class="option-group">
                <label class="option-label" for="platform">平台选项</label>
                <select id="platform">
                    <option value="DOS">DOS</option>
                    <option value="UNIX" selected>UNIX</option>
                </select>
            </div>
        </div>
        
        <div class="file-list" id="fileList">
            <div class="empty-message">暂无文件，请添加文件进行压缩</div>
        </div>
        
        <div class="actions">
            <button class="action-btn compress-btn" id="compressBtn">开始压缩</button>
            <button class="action-btn clear-btn" id="clearBtn">清空文件</button>
        </div>
        
        <div class="results" id="results">
            <h3>压缩结果</h3>
            <div class="result-item">
                <span>文件名:</span>
                <span id="resultFileName">-</span>
            </div>
            <div class="result-item">
                <span>压缩结果:</span>
                <span id="resultStatus">-</span>
            </div>
            <div class="result-item">
                <span>原始大小:</span>
                <span id="resultOriginalSize">-</span>
            </div>
            <div class="result-item">
                <span>压缩后大小:</span>
                <span id="resultCompressedSize">-</span>
            </div>
            <div class="result-item">
                <span>压缩率:</span>
                <span id="resultCompressionRatio">-</span>
            </div>
        </div>
        
        <div class="download-area" id="downloadArea">
            <h3>压缩完成!</h3>
            <p>您的ZIP文件已准备就绪，点击下方按钮下载</p>
            <button class="download-btn" id="downloadBtn">下载ZIP文件</button>
        </div>
        
        <div class="footer">
            <p>全程本地处理，完全安全，无需担心隐私问题</p>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const uploadArea = document.getElementById('uploadArea');
            const fileInput = document.getElementById('fileInput');
            const browseBtn = document.getElementById('browseBtn');
            const fileList = document.getElementById('fileList');
            const compressBtn = document.getElementById('compressBtn');
            const clearBtn = document.getElementById('clearBtn');
            const results = document.getElementById('results');
            const downloadArea = document.getElementById('downloadArea');
            const downloadBtn = document.getElementById('downloadBtn');
            
            const compressionLevel = document.getElementById('compressionLevel');
            const platform = document.getElementById('platform');
            
            let files = [];
            let zipBlob = null;
            
            // 浏览文件
            browseBtn.addEventListener('click', function() {
                fileInput.click();
            });
            
            // 文件选择处理
            fileInput.addEventListener('change', function(e) {
                handleFiles(e.target.files);
            });
            
            // 拖放处理
            uploadArea.addEventListener('dragover', function(e) {
                e.preventDefault();
                uploadArea.classList.add('dragover');
            });
            
            uploadArea.addEventListener('dragleave', function() {
                uploadArea.classList.remove('dragover');
            });
            
            uploadArea.addEventListener('drop', function(e) {
                e.preventDefault();
                uploadArea.classList.remove('dragover');
                handleFiles(e.dataTransfer.files);
            });
            
            // 处理选择的文件
            function handleFiles(newFiles) {
                for (let i = 0; i < newFiles.length; i++) {
                    const file = newFiles[i];
                    
                    // 检查是否已存在同名文件
                    if (!files.some(f => f.name === file.name && f.size === file.size)) {
                        files.push(file);
                    }
                }
                
                updateFileList();
            }
            
            // 更新文件列表显示
            function updateFileList() {
                if (files.length === 0) {
                    fileList.innerHTML = '<div class="empty-message">暂无文件，请添加文件进行压缩</div>';
                    compressBtn.disabled = true;
                    return;
                }
                
                fileList.innerHTML = '';
                compressBtn.disabled = false;
                
                files.forEach((file, index) => {
                    const fileItem = document.createElement('div');
                    fileItem.className = 'file-item';
                    
                    const fileSize = formatFileSize(file.size);
                    
                    fileItem.innerHTML = `
                        <div class="file-info">
                            <span class="file-icon">📄</span>
                            <div>
                                <div class="file-name">${file.name}</div>
                                <div class="file-size">${fileSize}</div>
                            </div>
                        </div>
                        <button class="delete-btn" data-index="${index}">×</button>
                    `;
                    
                    fileList.appendChild(fileItem);
                });
                
                // 添加删除事件监听
                document.querySelectorAll('.delete-btn').forEach(btn => {
                    btn.addEventListener('click', function() {
                        const index = parseInt(this.getAttribute('data-index'));
                        files.splice(index, 1);
                        updateFileList();
                    });
                });
            }
            
            // 格式化文件大小
            function formatFileSize(bytes) {
                if (bytes === 0) return '0 Bytes';
                
                const k = 1024;
                const sizes = ['Bytes', 'KB', 'MB', 'GB'];
                const i = Math.floor(Math.log(bytes) / Math.log(k));
                
                return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
            }
            
            // 清空文件
            clearBtn.addEventListener('click', function() {
                files = [];
                updateFileList();
                results.style.display = 'none';
                downloadArea.style.display = 'none';
            });
            
            // 压缩文件
            compressBtn.addEventListener('click', function() {
                if (files.length === 0) {
                    alert('请先添加文件');
                    return;
                }
                
                // 显示加载状态
                compressBtn.textContent = '压缩中...';
                compressBtn.disabled = true;
                
                // 创建ZIP文件
                const zip = new JSZip();
                
                // 添加文件到ZIP
                files.forEach(file => {
                    zip.file(file.name, file);
                });
                
                // 设置压缩选项
                const options = {
                    compression: "DEFLATE",
                    compressionOptions: {
                        level: parseInt(compressionLevel.value)
                    },
                    platform: platform.value === "UNIX" ? "UNIX" : "DOS"
                };
                
                // 生成ZIP文件
                zip.generateAsync({type: "blob", ...options})
                    .then(function(blob) {
                        zipBlob = blob;
                        
                        // 计算压缩结果
                        const originalSize = files.reduce((total, file) => total + file.size, 0);
                        const compressedSize = blob.size;
                        const compressionRatio = ((1 - compressedSize / originalSize) * 100).toFixed(2);
                        
                        // 更新结果界面
                        document.getElementById('resultFileName').textContent = `压缩文件_${new Date().getTime()}.zip`;
                        document.getElementById('resultStatus').textContent = '成功';
                        document.getElementById('resultOriginalSize').textContent = formatFileSize(originalSize);
                        document.getElementById('resultCompressedSize').textContent = formatFileSize(compressedSize);
                        document.getElementById('resultCompressionRatio').textContent = `${compressionRatio}%`;
                        
                        results.style.display = 'block';
                        downloadArea.style.display = 'block';
                        
                        // 恢复按钮状态
                        compressBtn.textContent = '开始压缩';
                        compressBtn.disabled = false;
                    })
                    .catch(function(error) {
                        alert('压缩过程中出现错误: ' + error.message);
                        
                        // 恢复按钮状态
                        compressBtn.textContent = '开始压缩';
                        compressBtn.disabled = false;
                    });
            });
            
            // 下载ZIP文件
            downloadBtn.addEventListener('click', function() {
                if (!zipBlob) {
                    alert('没有可下载的文件');
                    return;
                }
                
                const url = URL.createObjectURL(zipBlob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `压缩文件_${new Date().getTime()}.zip`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            });
            
            // 初始化
            updateFileList();
        });
    </script>
		<div align="center"><br />
<a href="/tools/" style="font-size:12px;color:#999999;text-decoration: none;">返回工具列表</a>	<span style="font-size:12px;color:#999999;">联系站长 E651@msn.com</span>
</div>
</body>
</html>
